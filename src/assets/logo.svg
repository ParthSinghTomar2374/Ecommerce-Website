<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="auraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow circle -->
  <circle cx="50" cy="50" r="46" fill="url(#glowEffect)" />

  <!-- Outer Luxury Aura Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#auraGradient)" stroke-width="2.5" stroke-dasharray="140 10 30 10" stroke-linecap="round" opacity="0.9" />

  <!-- Stylized Monogram 'A' with Couture Geometry -->
  <path d="M50 18 L26 76 H36 L43 58 H57 L64 76 H74 L50 18 Z M50 36 L54.5 50 H45.5 L50 36 Z" 
        fill="url(#auraGradient)" />

  <!-- Sparkling Luxury Diamond Accent -->
  <path d="M50 13 L52.5 18 L50 23 L47.5 18 Z" fill="url(#goldAccent)" filter="url(#subtleGlow)" />
  <circle cx="50" cy="18" r="1.5" fill="#FFFFFF" />
  
  <!-- Subtle "& Co." orbiting sparkle -->
  <circle cx="78" cy="30" r="2" fill="url(#goldAccent)" />
</svg>
